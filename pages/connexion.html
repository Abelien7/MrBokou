<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion — MrBokou</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="/index.html" class="navbar-logo">🏠🔧 MrBokou</a>
    <div class="navbar-actions">
      <a href="/pages/inscription.html" class="btn btn-ghost btn-sm">Créer un compte</a>
    </div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card card">
    <div class="card-body">
      <h2 class="mb-2">Connexion</h2>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" required/>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Mot de passe</label>
          <input class="form-control" type="password" id="password" required/>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Se connecter</button>
      </form>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/security.js"></script>
<script src="/js/auth.js"></script>
<script>
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    Security.clearAllErrors("login-form");
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const btn = document.getElementById("submit-btn");
    btn.disabled = true;
    btn.textContent = "Connexion...";

    try {
      const { role } = await Auth.login(email, password);
      if (role === ROLES.ARTISAN) window.location.href = "/pages/artisan-dashboard.html";
      else if (role === ROLES.ADMIN) window.location.href = "/pages/admin.html";
      else window.location.href = "/pages/client-dashboard.html";
    } catch (err) {
      showToast(err.message, "error");
      btn.disabled = false;
      btn.textContent = "Se connecter";
    }
  });
</script>
</body>
</html>
